<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel ANP — Produção x Comércio Exterior de Petróleo (2020–2025)</title>
  <style>
    :root { --azul-anp: #1351b4; --cinza: #f1f1f1; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", Arial, sans-serif; background: var(--cinza); }
    header {
      background: var(--azul-anp); color: #fff;
      padding: 14px 28px; display: flex; align-items: center; gap: 16px;
    }
    header h1 { font-size: 1.05rem; font-weight: 600; }
    header span { font-size: .8rem; opacity: .85; }
    main { padding: 18px 28px; height: calc(100vh - 54px); }
    #conteiner-relatorio { width: 100%; height: 100%; background: #fff;
      border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,.12); overflow: hidden; }
    #mensagem-erro { display: none; padding: 40px; text-align: center; color: #b00; }
  </style>
</head>
<body>
  <header>
    <h1>Petróleo — Produção × Importações/Exportações e Fases Contratuais</h1>
    <span>Fonte: ANP · Período: 2020–2025 · Uso interno</span>
  </header>

  <main>
    <div id="conteiner-relatorio"></div>
    <div id="mensagem-erro">
      Não foi possível carregar o relatório. Verifique a conexão com o Power BI Service
      e o endpoint interno <code>/api/powerbi/embed-token</code>.
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/powerbi-client@2.22.4/dist/powerbi.min.js"></script>
  <script src="./embed.js"></script>
</body>
</html>
