# =============================================================================
# SISTEMA DE APURAÇÃO DE RENTABILIDADE - DOCKER COMPOSE
# Coordena o serviço Streamlit com injeção segura de credenciais via .env
# Uso: docker compose up --build
# =============================================================================
version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rentabilidade-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Garante que variáveis do .env sejam repassadas; valores no env_file têm precedência
      - DB_SERVER=${DB_SERVER}
      - DB_DATABASE=${DB_DATABASE}
      - DB_UID=${DB_UID}
      - DB_PWD=${DB_PWD}
      - DB_PORT=${DB_PORT:-1433}
      - DB_DRIVER=${DB_DRIVER:-ODBC Driver 17 for SQL Server}
    volumes:
      # Monta apenas o app.py e schema para desenvolvimento (hot-reload opcional)
      - ./app.py:/app/app.py
      # NÃO montar .env como volume em produção - já injetado via env_file
    networks:
      - rentabilidade-net
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Serviço opcional: SQL Server para desenvolvimento local
  # Descomente se desejar subir um SQL Server local sem depender de instância externa.
  # ATENÇÃO: Em produção corporativa, aponte DB_SERVER para a instância oficial.
  # ---------------------------------------------------------------------------
  # db:
  #   image: mcr.microsoft.com/mssql/server:2022-latest
  #   container_name: rentabilidade-db
  #   restart: unless-stopped
  #   environment:
  #     ACCEPT_EULA: "Y"
  #     SA_PASSWORD: "${DB_PWD}"
  #     MSSQL_PID: "Developer"
  #   ports:
  #     - "1433:1433"
  #   volumes:
  #     - sqlserver_data:/var/opt/mssql
  #     - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
  #   networks:
  #     - rentabilidade-net
  #   healthcheck:
  #     test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_PWD}", "-Q", "SELECT 1"]
  #     interval: 15s
  #     timeout: 10s
  #     retries: 10

networks:
  rentabilidade-net:
    driver: bridge

